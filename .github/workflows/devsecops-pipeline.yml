name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "Principal" ]
  pull_request:
    branches: [ "main", "Principal" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias para pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 || true

      - name: Compilar Imagen Docker
        run: |
          docker build -t sport-gym-api:${{ github.sha }} .

      - name: Escaneo de Vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sport-gym-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'