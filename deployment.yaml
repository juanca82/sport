apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-telemetry-deployment
  labels:
    app: gym-telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gym-telemetry
  template:
    metadata:
      labels:
        app: gym-telemetry
    spec:
      containers:
      - name: gym-telemetry-api
        image: sport-gym-api:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: API_KEY_SECRET
          value: "sport-secure-key-2026"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20